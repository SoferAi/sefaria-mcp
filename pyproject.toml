[project]
name = "sefaria-mcp"
version = "0.1.0"
description = "A FastMCP server for Sefaria"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi",
    "fastmcp",
    "pillow",
    "python-dotenv",
    "requests",
    "uvicorn",
]

[project.optional-dependencies]
hebrew-dates = ["hdate"]

[project.scripts]
sefaria-mcp = "sefaria_mcp.main:main" 
