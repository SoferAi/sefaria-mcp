[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "sefaria-mcp"
version = "0.1.0"
description = "A FastMCP server for Sefaria"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.116.1",
    "fastmcp>=2.10.6",
    "hdate>=1.1.2",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "uvicorn>=0.35.0",
]

[project.scripts]
sefaria-mcp = "sefaria_mcp.main:main" 
